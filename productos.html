<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Productos - Tienda Naturista</title>

<style>

body{
font-family: Arial;
margin:0;
background:#f4f8f2;
}

header{
background:#2e7d32;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
}

nav a{
color:white;
margin-left:20px;
text-decoration:none;
font-weight:bold;
}

.productos{
display:grid;
grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
gap:20px;
padding:40px;
max-width:1000px;
margin:auto;
}

.producto{
background:#e8f5e9;
padding:20px;
border-radius:10px;
text-align:center;
box-shadow:0px 0px 10px rgba(0,0,0,0.1);
}

.producto img{
width:150px;
height:150px;
object-fit:cover;
}

.boton{
display:inline-block;
margin-top:10px;
padding:10px 15px;
background:#2e7d32;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

.boton:hover{
background:#1b5e20;
}

</style>

</head>

<body>

<header>

<h2>Tienda Naturista</h2>

<nav>
<a href="index.html">Inicio</a>
</nav>

</header>

<h1 style="text-align:center;margin-top:40px;">Nuestros Productos</h1>

<div class="productos">

<div class="producto">
<img src="complejo.png">
<h3>Complejo</h3>
<p>$25.000</p>
<button class="boton" onclick="agregarCarrito('Complejo Natural',25000)">
Agregar al carrito
</button>
</div>

<div class="producto">
<img src="vitamina.png">
<h3>Vitamina C</h3>
<p>$30.000</p>
<button class="boton" onclick="agregarCarrito('Vitamina C',30000)">
Agregar al carrito
</button>
</div>

<div class="producto">
<img src="Selenium-etc.png">
<h3>Colágeno</h3>
<p>$45.000</p>
<button class="boton" onclick="agregarCarrito('Colágeno',45000)">
Agregar al carrito
</button>
</div>

</div>

<script>

let carrito = JSON.parse(localStorage.getItem("carrito")) || []
let total = JSON.parse(localStorage.getItem("total")) || 0

function agregarCarrito(nombre,precio){

carrito.push({nombre,precio})
total += precio

localStorage.setItem("carrito",JSON.stringify(carrito))
localStorage.setItem("total",JSON.stringify(total))

alert("Producto agregado al carrito")

}

</script>

</body>
</html>
